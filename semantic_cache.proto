syntax = "proto3";
package semanticcache.v1;
option go_package = "github.com/AndrewK4758/shared_protos";

import "models.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";

service SemanticCacheService {
  rpc CheckCache(CheckCacheRequest) returns (CheckCacheResponse);
  rpc StoreExtraction(StoreExtractionRequest) returns (StoreExtractionResponse);
  rpc SeedCache(SeedCacheRequest) returns (SeedCacheResponse);
  rpc CheckMetadataExists(CheckMetadataRequest) returns (CheckMetadataResponse);
  rpc QueryBlankDocument(QueryBlankDocumentRequest) returns (QueryBlankDocumentResponse);
  rpc RegisterBlankDocument(RegisterBlankDocumentRequest) returns (RegisterBlankDocumentResponse);
  rpc MaskEntities(MaskEntitiesRequest) returns (MaskEntitiesResponse);
  rpc SemanticChunkDocument(SemanticChunkDocumentRequest) returns (SemanticChunkDocumentResponse);
  rpc GenerateSparseEmbedding(GenerateSparseEmbeddingRequest) returns (GenerateSparseEmbeddingResponse);
  rpc HybridCheckCache(HybridCheckCacheRequest) returns (HybridCheckCacheResponse);
  rpc HybridStoreExtraction(HybridStoreExtractionRequest) returns (HybridStoreExtractionResponse);
}





message CheckCacheRequest {
  bool enabled = 1;
  string collection_name = 2;
  bool cache_hit = 4;
  float confidence = 5;
  google.protobuf.Any embedding_lookup = 6;
  google.protobuf.Struct metadata_lookup = 7;
  document.models.v1.InfrastructureIdentity identity = 8;
}

message CheckCacheResponse {
  bool hit = 1;
  string extracted_payload = 2;
  float confidence = 3;
}

message StoreExtractionRequest {
  string collection_name = 1;
  document.models.v1.InfrastructureIdentity identity = 3;
  string extracted_payload = 4;
  google.protobuf.Struct metadata = 5;
  google.protobuf.Any embedding_payload = 6;
}

message StoreExtractionResponse {
  bool success = 1;
}

message SeedCacheRequest {
  string collection_name = 1;
  document.models.v1.InfrastructureIdentity identity = 3;
  string extracted_payload = 4;
  google.protobuf.Struct metadata = 5;
  google.protobuf.Any embedding_payload = 6;
}

message SeedCacheResponse {
  bool success = 1;
  string message = 2;
}

// Queue Wrappers
message CacheStoreMessage {
  string correlation_id = 1;
  StoreExtractionRequest request = 2;
}

message CheckMetadataRequest {
  string collection_name = 1;
  document.models.v1.InfrastructureIdentity identity = 2;
  google.protobuf.Struct metadata = 3;
}

message CheckMetadataResponse {
  bool exists = 1;
}

message QueryBlankDocumentRequest {
  string collection_name = 1;
  google.protobuf.Any embedding_lookup = 2; // Extracted layout metadata or URL to blank image
  document.models.v1.InfrastructureIdentity identity = 3;
  float confidence_threshold = 4;
}

message QueryBlankDocumentResponse {
  bool is_blank_match = 1;
  float confidence = 2;
  string matched_classification = 3;
}

message RegisterBlankDocumentRequest {
  string collection_name = 1;
  google.protobuf.Any embedding_payload = 2;
  document.models.v1.InfrastructureIdentity identity = 3;
}

message RegisterBlankDocumentResponse {
  bool success = 1;
}

message ExtractedEntity {
  string entity_type = 1; // "PERSON", "LOCATION", "ORGANIZATION", "DATE", "TAX_ID"
  string raw_value = 2;
  string canonical_value = 3;
  int32 page_number = 4;
}

message MaskEntitiesRequest {
  document.models.v1.InfrastructureIdentity identity = 1;
  string document_text = 2;
  repeated ExtractedEntity entities = 3;
}

message MaskEntitiesResponse {
  string masked_text = 1;
  map<string, string> surrogate_map = 2;
  int32 total_replacements = 3;
}

message SemanticChunk {
  string chunk_id = 1;
  string content = 2; // full formatted markdown chunk with header
  string section_title = 3;
  int32 section_level = 4;
  int32 chunk_index = 5;
  int32 token_count = 6;
  bool is_table_continuation = 7;
}

message SemanticChunkDocumentRequest {
  document.models.v1.InfrastructureIdentity identity = 1;
  string document_type = 2;
  string document_text = 3;
  repeated ExtractedEntity entities = 4;
  int32 max_chunk_tokens = 5;
  int32 overlap_tokens = 6;
  bool apply_masking = 7;
}

message SemanticChunkDocumentResponse {
  repeated SemanticChunk chunks = 1;
  map<string, string> surrogate_map = 2;
  int32 total_chunks = 3;
  int32 total_tokens = 4;
}

message SparseVectorProto {
  repeated uint32 indices = 1;
  repeated float values = 2;
}

message GenerateSparseEmbeddingRequest {
  document.models.v1.InfrastructureIdentity identity = 1;
  string text = 2;
}

message GenerateSparseEmbeddingResponse {
  SparseVectorProto sparse_vector = 1;
  int32 unique_terms = 2;
}

message HybridCheckCacheRequest {
  string collection_name = 1;
  document.models.v1.InfrastructureIdentity identity = 2;
  string query_text = 3;
  repeated float dense_vector = 4;
  SparseVectorProto sparse_vector = 5;
  google.protobuf.Struct metadata_lookup = 6;
  float confidence_threshold = 7;
  float alpha = 8; // weight for dense vector (e.g. 0.7)
}

message HybridCheckCacheResponse {
  bool hit = 1;
  string extracted_payload = 2;
  float combined_score = 3;
  float dense_score = 4;
  float sparse_score = 5;
}

message HybridStoreExtractionRequest {
  string collection_name = 1;
  document.models.v1.InfrastructureIdentity identity = 2;
  string document_type = 3;
  string section_title = 4;
  string extracted_payload = 5;
  repeated float dense_vector = 6;
  SparseVectorProto sparse_vector = 7;
  google.protobuf.Struct metadata = 8;
}

message HybridStoreExtractionResponse {
  bool success = 1;
}



