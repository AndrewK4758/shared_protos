syntax = "proto3";

package document.orchestrator.v1;

option go_package = "doc_processor/shared_protos";

import "processor.proto";

service OrchestratorService {
  // Client submits a large PDF and immediately receives a JobID. Heavy payload is cached.
  rpc SubmitDocument(SubmitDocumentRequest) returns (SubmitDocumentResponse);
  
  // Client submits a single, generic step to be executed for a specific JobID.
  rpc SubmitStep(SubmitStepRequest) returns (SubmitStepResponse);

  // Client listens to this Server Stream to get real-time progress of their JobID
  rpc ListenForProgress(ListenRequest) returns (stream ProgressUpdate);

  // Resume a job after human validation has corrected the AI output
  rpc ResumeJob(ResumeJobRequest) returns (ResumeJobResponse);
}

message SubmitDocumentRequest {
  repeated bytes pdf_contents = 1;
  
  // Fields mirrored from the AI Service ProcessDocumentRequest
  document.processor.v1.ModelChoice model_choice = 6;
  string document_type = 7;
  repeated string target_fields = 8;
  string app_id = 9;
  string correlation_id = 10;

  // Compliance & Traceability Metadata
  string tenant_id = 11;
  string user_id = 12;

  // Raw text or HTML contents (e.g., email bodies) that bypass PDF chunking
  repeated string raw_text_contents = 14;
}

message SubmitDocumentResponse {
  string job_id = 1;
  string status = 2; // e.g., "CACHED"
}

message SubmitStepRequest {
  string job_id = 1; // Required. Associates this step with a stored document/payload.
  string action_type = 2; // e.g., "AI_EXTRACTION", "HUMAN_VALIDATION"
  
  // The specific context for this single action
  string step_name = 3;
  string custom_instructions = 4; 
  string expected_schema = 5;
  
  // Input data appended by the client (e.g., previous step results needed for this step)
  string context_input = 6; 
  
  // Where the orchestrator should send the result of this step
  string callback_address = 7; 
  
  // Execution flags
  bool require_human_review = 8; // Force manual human review even if AI matches schema
  bool bypass_human_fallback = 9; // Bypass human-in-the-loop validation completely on failure
}

message SubmitStepResponse {
  bool success = 1;
  string message = 2;
  string step_id = 3; // Unique ID for tracking this specific step execution
}

message ListenRequest {
  string job_id = 1;
}

message ProgressUpdate {
  string job_id = 1;
  string status = 2; // e.g., "CHUNKING", "PROCESSING", "STITCHING", "COMPLETE", "FAILED"
  string message = 3; // Detailed message, e.g., "Processing chunk 2 of 5"
  
  // Only populated when status == "COMPLETE"
  string final_results_json = 4;
}

message ResumeJobRequest {
  string job_id = 1;
  string corrected_json = 2;
  string step_id = 3;
}

message ResumeJobResponse {
  bool success = 1;
  string message = 2;
}

// A completely generic gRPC service that any external application can implement
// to receive the lightweight callback containing the step result.
service StepCallbackService {
  rpc OnStepComplete(StepCompleteRequest) returns (StepCompleteResponse);
}

message StepCompleteRequest {
  string job_id = 1;
  string step_id = 2;
  string action_type = 3;
  string result_json = 4;
  string error_message = 5;
}

message StepCompleteResponse {
  bool success = 1;
}
