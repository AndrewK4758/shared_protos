syntax = "proto3";

package document.orchestrator.v1;

option go_package = "doc_processor/shared_protos";

import "processor.proto";

service OrchestratorService {
  // Client submits a large PDF and immediately receives a JobID
  rpc SubmitDocument(SubmitDocumentRequest) returns (SubmitDocumentResponse);
  
  // Client listens to this Server Stream to get real-time progress of their JobID
  rpc ListenForProgress(ListenRequest) returns (stream ProgressUpdate);

  // Resume a job after human validation has corrected the AI output
  rpc ResumeJob(ResumeJobRequest) returns (ResumeJobResponse);
}

message WorkflowStep {
  string step_name = 1; // User-defined name for logging/tracing
  string custom_instructions = 2; // Prompt for the AI
  string expected_schema = 3; // Expected JSON schema
  string callback_address = 4; // Address to fetch dynamic instructions from
  bool require_human_review = 5; // Force manual human review even if AI matches schema
  bool bypass_human_fallback = 6; // Bypass human-in-the-loop validation completely on failure
  string target_action_address = 7; // Generic gRPC/HTTP address to send final validated JSON to
}

message SubmitDocumentRequest {
  repeated bytes pdf_contents = 1;
  
  // The dynamically provided workflow steps to execute
  repeated WorkflowStep steps = 2;
  
  // Fields mirrored from the AI Service ProcessDocumentRequest
  document.processor.v1.ModelChoice model_choice = 6;
  string document_type = 7;
  repeated string target_fields = 8;
  string app_id = 9;
  string correlation_id = 10;

  // New Compliance & Traceability Metadata
  string tenant_id = 11;
  string user_id = 12;

  // Raw text or HTML contents (e.g., email bodies) that bypass PDF chunking
  repeated string raw_text_contents = 14;

  // New Goal-Oriented ReAct Agent fields
  string overarching_goal = 15; // Goal for the agent, e.g. "Extract total invoice amount and verify"
  repeated string enabled_tools = 16; // List of tools the agent can use
}

message SubmitDocumentResponse {
  string job_id = 1;
  string status = 2; // e.g., "QUEUED"
}

message ListenRequest {
  string job_id = 1;
}

message ProgressUpdate {
  string job_id = 1;
  string status = 2; // e.g., "CHUNKING", "PROCESSING", "STITCHING", "COMPLETE", "FAILED"
  string message = 3; // Detailed message, e.g., "Processing chunk 2 of 5"
  
  // Only populated when status == "COMPLETE"
  string final_results_json = 4;
}

message ResumeJobRequest {
  string job_id = 1;
  string corrected_json = 2;
}

message ResumeJobResponse {
  bool success = 1;
  string message = 2;
}

// A completely generic gRPC service that any external application can implement
// to execute deterministic end-actions on validated JSON payloads.
service GenericActionService {
  rpc ExecuteAction(GenericActionRequest) returns (GenericActionResponse);
}

message GenericActionRequest {
  string job_id = 1;
  string step_name = 2;
  string payload_json = 3;
}

message GenericActionResponse {
  bool success = 1;
  string message = 2;
  string result_json = 3;
}
