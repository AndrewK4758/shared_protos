syntax = "proto3";

package document.orchestrator.v1;

option go_package = "doc_processor/shared_protos";

import "processor.proto";

service OrchestratorService {
  // Client submits a large PDF and immediately receives a JobID
  rpc SubmitDocument(SubmitDocumentRequest) returns (SubmitDocumentResponse);
  
  // Client listens to this Server Stream to get real-time progress of their JobID
  rpc ListenForProgress(ListenRequest) returns (stream ProgressUpdate);
}

message SubmitDocumentRequest {
  repeated bytes pdf_contents = 1;
  // Action to perform: "CLASSIFY" or "PARSE"
  string action = 3;
  
  // The JSON schema to extract (Required if action == "PARSE")
  string expected_schema = 4;
  
  // Any specific custom instructions for the LLM
  string custom_instructions = 5;
  
  // Fields mirrored from the AI Service ProcessDocumentRequest
  document.processor.v1.ModelChoice model_choice = 6;
  string document_type = 7;
  repeated string target_fields = 8;
  string app_id = 9;
  string correlation_id = 10;

  // New Compliance & Traceability Metadata
  string tenant_id = 11;
  string user_id = 12;

  // Allowed classification types for the CLASSIFY action
  repeated string allowed_classifications = 13;

  // Raw text or HTML contents (e.g., email bodies) that bypass PDF chunking
  repeated string raw_text_contents = 14;
}

message SubmitDocumentResponse {
  string job_id = 1;
  string status = 2; // e.g., "QUEUED"
}

message ListenRequest {
  string job_id = 1;
}

message ProgressUpdate {
  string job_id = 1;
  string status = 2; // e.g., "CHUNKING", "PROCESSING", "STITCHING", "COMPLETE", "FAILED"
  string message = 3; // Detailed message, e.g., "Processing chunk 2 of 5"
  
  // Only populated when status == "COMPLETE"
  string final_results_json = 4;
}
