syntax = "proto3";

package document.orchestrator.v1;

option go_package = "github.com/AndrewK4758/shared_protos";
option csharp_namespace = "Document.Orchestrator.V1";

import "processor.proto";
import "models.proto";
import "google/protobuf/struct.proto";

service OrchestratorService {
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  
  rpc StartJob(StartJobRequest) returns (StartJobResponse);

  // Client submits a single, generic step to be executed for a specific JobID.
  rpc SubmitStep(SubmitStepRequest) returns (SubmitStepResponse);

  // Client listens to this Server Stream to get real-time progress of their JobID
  rpc ListenForProgress(ListenRequest) returns (stream ProgressUpdate);

  // Resume a job after human validation has corrected the AI output
  rpc ResumeJob(ResumeJobRequest) returns (ResumeJobResponse);
}

message SubmitJobRequest {
  document.models.v1.WorkflowContext context = 1;
  repeated document.models.v1.StepDefinition steps = 3;
  repeated document.models.v1.JobWorkflowEdge job_graph = 4;
  
  document.models.v1.ModelChoice model_choice = 7;
  repeated string target_fields = 8;
  repeated document.models.v1.ActionDefinition action_definitions = 10;
  string callback_address = 11;
}

message SubmitJobResponse {
  string job_id = 1;
  string status = 2; // e.g., "CACHED"
}

message StartJobRequest {
  string job_id = 1;
}

message StartJobResponse {
  bool success = 1;
  string message = 2;
  string active_step_id = 3;
}

message SubmitStepRequest {
  string job_id = 1;
  string step_id = 2;
  string custom_instructions = 3;
  string expected_schema = 4;
  bool complete_job = 5;
}

message SubmitStepResponse {
  bool success = 1;
  string message = 2;
  string step_id = 3; // Unique ID for tracking this specific step execution
}

message ListenRequest {
  string job_id = 1;
}

message ProgressUpdate {
  string job_id = 1;
  string status = 2; // e.g., "CHUNKING", "PROCESSING", "STITCHING", "COMPLETE", "FAILED"
  string message = 3; // Detailed message, e.g., "Processing chunk 2 of 5"
  
  // Only populated when status == "COMPLETE"
  string final_results_json = 4;
}

message ResumeJobRequest {
  string job_id = 1;
  string corrected_json = 2;
  string step_id = 3;
}

message ResumeJobResponse {
  bool success = 1;
  string message = 2;
}

service OrchestratorCallbackService {
  rpc OnStepComplete(StepCompleteRequest) returns (StepCompleteResponse);
  rpc OnJobFailed(JobFailedRequest) returns (JobFailedResponse);
  
  // Client State Fallback
  rpc GetJobDetails(GetJobDetailsRequest) returns (GetJobDetailsResponse);
}

message StepCompleteRequest {
  string job_id = 1;
  string job_definition_id = 2; // Extracted from ActiveJobExecution / Context
  string completed_step_id = 3; 
  google.protobuf.Struct global_state = 4; // Contains extracted data to evaluate routing rules
  google.protobuf.Struct step_output = 5; // The isolated output of the step that just completed
}

message StepCompleteResponse {
  bool success = 1; 
}

message JobFailedRequest {
  string job_id = 1;
  string failed_step_id = 2;
  string error_message = 3;
}

message JobFailedResponse {
  bool success = 1;
}

message GetJobDetailsRequest {
  string job_id = 1;
}

message GetJobDetailsResponse {
  bool found = 1;
  SubmitJobRequest original_request = 2;
}
