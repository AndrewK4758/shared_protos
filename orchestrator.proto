syntax = "proto3";

package document.orchestrator.v1;

option go_package = "github.com/AndrewK4758/shared_protos";
option csharp_namespace = "Document.Orchestrator.V1";

import "google/protobuf/struct.proto";
import "models.proto";

service OrchestratorService {
  // Unified endpoint replacing SubmitJob, StartJob, and SubmitStep
  rpc ExecuteWorkflowNode(ExecuteWorkflowNodeRequest) returns (ExecuteWorkflowNodeResponse);

  // Client listens to this Server Stream to get real-time progress of their JobID
  rpc ListenForProgress(ListenRequest) returns (stream ProgressUpdate);

  // Resume a job after human validation has corrected the AI output
  rpc ResumeJob(ResumeJobRequest) returns (ResumeJobResponse);

  // Commands the Orchestrator to cancel jobs and optionally purge streams.
  rpc PurgeSystemState(PurgeSystemStateRequest) returns (PurgeSystemStateResponse);
}

message ExecuteWorkflowNodeRequest {
  string step_id = 1;
  string callback_address = 2;
  
  // First-Class Identity & Metadata
  document.models.v1.InfrastructureIdentity identity = 3;
  map<string, string> metadata = 4; 

  // Core Configuration
  document.models.v1.NodeConfiguration node_config = 5;

  // Root-Level Service Contracts (Each service handles its own object)
  document.models.v1.StorageContract storage = 6;
  document.models.v1.DocumentProcessorContract document_processor = 7;
  document.models.v1.CacheContract cache = 8;
  document.models.v1.HumanValidationContract human_validation = 9;

  // The Clean Data Payload 
  document.models.v1.GlobalState global_state = 10; 

  // Output destination for the LLM inference
  google.protobuf.Struct node_output = 11; 

  int32 inference_retry_count = 12;

  // Execution Status (For callbacks and webhook returns)
  bool success = 13;
  document.models.v1.ErrorContract error_contract = 14;

  int32 job_name_id = 15;
}

message ExecuteWorkflowNodeResponse {
  bool success = 1;
  string message = 2;
  string step_id = 3;
}

message ListenRequest {

  document.models.v1.InfrastructureIdentity identity = 2;
}

message ProgressUpdate {

  string status = 2; // e.g., "CHUNKING", "PROCESSING", "STITCHING", "COMPLETE", "FAILED"
  string message = 3; // Detailed message, e.g., "Processing chunk 2 of 5"
  
  // Only populated when status == "COMPLETE"
  google.protobuf.Struct final_results = 4;
  
  document.models.v1.InfrastructureIdentity identity = 5;
}

message ResumeJobRequest {

  google.protobuf.Struct corrected = 2;
  string step_id = 3;
  document.models.v1.InfrastructureIdentity identity = 4;
}

message ResumeJobResponse {
  bool success = 1;
  string message = 2;
}

message PurgeSystemStateRequest {
         // Scopes the cancellation to a specific tenant/app
  bool purge_queues = 2;     // Explicit command to purge NATS JetStream queues
  document.models.v1.InfrastructureIdentity identity = 3;
}

message PurgeSystemStateResponse {
  bool success = 1;
  int32 jobs_cancelled = 2;
  int32 queues_purged = 3;
}

service OrchestratorCallbackService {
  rpc OnNodeExecutionComplete(stream ExecuteWorkflowNodeRequest) returns (stream NodeExecutionCompleteResponse);
  rpc OnJobFailed(ExecuteWorkflowNodeRequest) returns (JobFailedResponse);
  rpc OnJobSuspended(ExecuteWorkflowNodeRequest) returns (JobSuspendedResponse);
}


message NodeExecutionCompleteResponse {
  bool success = 1; 
}

message JobFailedResponse {
  bool success = 1;
}

message JobSuspendedResponse {
  bool success = 1;
}
