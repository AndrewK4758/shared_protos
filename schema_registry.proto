syntax = "proto3";

package document.registry.v1;

option go_package = "doc_processor/shared_protos";

service SchemaRegistryService {
  rpc GetRulesForClassification(GetRulesRequest) returns (GetRulesResponse);
}

message GetRulesRequest {
  string classification_name = 1;
}

message GetRulesResponse {
  bool success = 1;
  string error_message = 2;
  string rules_text = 3;
  string json_schema = 4;
}
