syntax = "proto3";

package document.models.v1;

option go_package = "github.com/AndrewK4758/shared_protos";
option csharp_namespace = "Document.Models.V1";

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message ErrorContract {
    string code = 1;
    string source = 2;
    string message = 3;
    google.protobuf.Timestamp timestamp = 4;
    google.protobuf.Struct client_payload = 6;
}

message InfrastructureIdentity {
  string tenant_id = 1;
  string app_id = 2;
  string job_id = 3;
}

enum ModelChoice {
  MODEL_CHOICE_UNSPECIFIED = 0;
  MODEL_CHOICE_EXTRACTION = 1;
  MODEL_CHOICE_CLASSIFICATION = 2;
  MODEL_CHOICE_PLANNING = 3;
  MODEL_CHOICE_OCR = 4;
}



message StorageContract {
  string document_uri = 1;
  string document_path = 2;
  int32 page_count = 3;
}

message DocumentProcessorContract {
  string action_name_classify = 1;
  string action_name_boundary = 2;
  string doc_type_corrupted = 3;
  string doc_type_classified = 4;
  string doc_type_chunked = 5;
  string boundary_detection_prompt = 6;
  int32 max_pages_before_split = 7;
  int32 sliding_window_size = 8;
}

message CacheContract {
  bool enabled = 1;
  string collection_name = 2;
  bool cache_hit = 4;
  float confidence = 5;
  google.protobuf.Any embedding_lookup = 6;
  google.protobuf.Struct metadata_lookup = 7;
  string plain_text_embedding_value = 8;
}

message HumanValidationContract {
  bool required = 1;
  bool bypass_fallback = 2;
}

message NodeConfiguration {
  string node_name = 1;
  string system_instructions = 2;

  string target_worker_subject = 4;
  string state_output_key = 5;
  string inference_input_key = 6;
  google.protobuf.Struct expected_schema_struct = 7;
}

message ActionDefinition {
  string id = 1;
  string name = 2;
  string prompt = 3;
  repeated string rules = 4;
  string target_worker_subject = 6;
}

message ActiveJobExecution {
  string job_id = 1;
  string job_definition_id = 2;
  string current_step_id = 3;
  string status = 4;
  string created_at = 5;
  string updated_at = 6;
}

enum WorkflowState {
  WORKFLOW_STATE_UNSPECIFIED = 0;
  WORKFLOW_STATE_PENDING = 1;
  WORKFLOW_STATE_PROCESSING = 2;
  WORKFLOW_STATE_SUSPENDED = 3;
  WORKFLOW_STATE_COMPLETED = 4;
  WORKFLOW_STATE_FAILED = 5;
  WORKFLOW_STATE_CANCELED = 6;
}

message GenericWorkflowState {
  WorkflowState current_state = 1;
  string state_reason = 2;
  google.protobuf.Struct state_payload = 3;
  google.protobuf.Timestamp last_updated = 4;
  InfrastructureIdentity identity = 5;
}

message ExecuteTaskPayload {
  NodeConfiguration node_config = 1;
  google.protobuf.Struct global_state = 2;
  google.protobuf.Struct node_output = 3;
  google.protobuf.Struct metadata = 4;
  CacheContract cache = 5;
  HumanValidationContract human_validation = 6;
  StorageContract storage = 7;
  DocumentProcessorContract document_processor = 8;
}



message GlobalState {
  google.protobuf.Struct functional = 1;
  google.protobuf.Struct non_functional = 2;
}

message RootWorkflowPayload {
  string graph_id = 1;
  string initial_node_id = 2;

  google.protobuf.Struct metadata = 4;
  CacheContract cache = 5;
  GlobalState global_state = 6;
  NodeConfiguration node_config = 7;
  StorageContract storage = 8;
  DocumentProcessorContract document_processor = 9;
  google.protobuf.Struct expected_schema_struct = 10;
}

enum ValidationTier {
  VALIDATION_TIER_UNSPECIFIED = 0;
  VALIDATION_TIER_1_EXACT = 1;
  VALIDATION_TIER_2_FUZZY = 2;
  VALIDATION_TIER_3_LLM_ARBITER = 3;
}

message FieldValidationRequest {
  InfrastructureIdentity identity = 1;
  string field_key = 2;
  string db_value = 3;
  string document_value = 4;
  ValidationTier target_tier = 5;
}

message FieldValidationResult {
  string field_key = 1;
  bool is_valid = 2;
  ValidationTier tier_passed = 3;
  float confidence = 4;
  string reason = 5;
}

message DocumentValidationReport {
  InfrastructureIdentity identity = 1;
  bool all_fields_valid = 2;
  repeated FieldValidationResult field_results = 3;
  bool hitl_required = 4;
}

